<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>J2ME Game Store - Kho Game Java (.JAR)</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="brand">J2ME Game Store</a>
      <form id="search-form" class="search-bar">
        <input type="search" id="search-input" placeholder="Tìm tên game Java..." />
        <button type="submit">Tìm</button>
      </form>
    </div>
  </header>

  <main class="container">
    <div id="category-bar" class="category-bar"></div>
    <section id="game-grid" class="game-grid">
      <p>Đang tải danh sách game...</p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">Kho lưu trữ game Java J2ME (.JAR) tải trực tiếp không cần đăng nhập.</div>
  </footer>

  <script src="/js/index.js" type="module"></script>
</body>
</html>
